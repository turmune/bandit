# Local overlay for the WSL2 GPU box (RTX 3060 12 GB, 8 GB host RAM).
#
#   docker compose -f docker-compose.yaml \
#                  -f docker-compose.gpu.yaml \
#                  -f docker-compose.local.yaml up -d --build
#
# Two things the upstream files assume that are not true here:
#
#   1. RAM. The base file is sized for a 16 GB host and the GPU overlay keeps
#      its 6G worker cap. WSL2 gets 5 GB total on this 8 GB machine, so a 6G
#      cap is not a limit the host can honour -- exactly the failure the base
#      file's own comment warns about, where the kernel picks its own victim
#      instead of the container being capped cleanly.
#
#   2. Batch size. The GPU overlay calls 8 "a conservative start for a 12 GB
#      card". Measured on this 3060 it is not: batch 8 dies with a 9.35 GiB
#      allocation failure inside the GRU. Batch 4 fits and is also the fastest
#      (best preset: 29.0s at batch 4, 31.9s at 6, 33.8s at 2).
#
# The whole `resources` map is restated for the worker rather than just the
# limits, because the GPU overlay's own comment notes that some compose
# versions replace the map wholesale when an override touches it -- and losing
# `reservations` here would silently drop the GPU and run on the CPU.

services:
  worker:
    environment:
      BANDIT_BATCH_SIZE: "4"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          # Model weights live in VRAM, so host RSS here is the decoded PCM of
          # the input (~1.3 GB per hour of 48 kHz stereo) plus ~1 GB of torch
          # runtime. 3G covers roughly a 90-minute input; longer files need
          # more WSL memory before they need a bigger cap.
          memory: 3G
          cpus: "6.5"

  api:
    # The GPU overlay binds only to 127.0.0.1 so `tailscale serve` can front it.
    # This adds the tailnet address alongside it, which is what containers on
    # other tailnet hosts actually dial: MagicDNS names resolve via the host's
    # Tailscale resolver, and a Docker container uses Docker's resolver instead,
    # so the name fails inside a container even when the tunnel is up.
    # Compose appends port entries rather than replacing them, so 127.0.0.1
    # keeps working for local testing. Still never 0.0.0.0 -- that would put the
    # card on the LAN, which is what the loopback binding exists to prevent.
    # The address comes from .env rather than being written here, because this
    # file is version controlled and a tailnet address is host-specific. Follows
    # the base file's convention for BANDIT_API_KEY: required, with the error
    # message naming the fix, since a silent default would either collide with
    # the GPU overlay's 127.0.0.1 entry or quietly publish nothing.
    ports:
      - "${BANDIT_BIND_ADDR:?set BANDIT_BIND_ADDR in .env to this host's tailnet address}:8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.5"

  redis:
    deploy:
      resources:
        limits:
          memory: 320M

  reaper:
    deploy:
      resources:
        limits:
          memory: 128M
