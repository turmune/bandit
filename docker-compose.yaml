# Coolify: add as a "Docker Compose" resource pointing at this repo.
# Expose ONLY the `api` service to a domain; worker and redis stay internal.
#
# Sized for an 8 vCPU / 16 GB host.

services:
  api:
    build: .
    restart: unless-stopped
    # Coolify routes the domain to this container port. No `ports:` mapping --
    # that would bypass the proxy and publish straight on the host.
    expose:
      - "8000"
    environment:
      BANDIT_REDIS_URL: redis://redis:6379/0
      BANDIT_DATA_DIR: /data
      BANDIT_MAX_UPLOAD_BYTES: "2147483648"
      BANDIT_DEFAULT_QUALITY: balanced
      # Set in Coolify's Environment Variables tab. Without it every /v1 route
      # is open to the internet, and one POST can occupy the box for hours.
      BANDIT_API_KEY: ${BANDIT_API_KEY:?set BANDIT_API_KEY in Coolify}
    volumes:
      - bandit-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  worker:
    build: .
    restart: unless-stopped
    # Fetch weights on first boot, then serve the queue. Idempotent: the script
    # verifies md5 and no-ops when the checkpoint is already present.
    command: ["sh", "scripts/worker-entrypoint.sh"]
    environment:
      BANDIT_REDIS_URL: redis://redis:6379/0
      BANDIT_DATA_DIR: /data
      BANDIT_CKPT_PATH: /data/models/checkpoint-multi-inference.pt
      # Leave ~2 cores for api + redis + OS. Oversubscribing torch threads
      # slows this workload down; it does not speed it up.
      BANDIT_THREADS: "6"
      BANDIT_BATCH_SIZE: "2"
      BANDIT_SEGMENT_SECONDS: "60"
      OMP_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
    volumes:
      - bandit-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Passes once an RQ worker for this container is registered and beating
      # in Redis, so a crashed or wedged worker gets restarted rather than
      # silently holding the queue.
      test: ["CMD", "python", "-m", "bandit_api.healthcheck", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot downloads ~447 MB from Zenodo and converts it before the
      # worker registers. Failures during start_period do not count toward
      # retries, and a first success ends it early, so being generous is cheap.
      start_period: 1800s
    deploy:
      resources:
        limits:
          # Must be a limit the host can actually honour with a build running.
          # At 10G on a 16GB box the container could grow until the *host* ran
          # out, at which point the kernel picks its own victim -- observed
          # killing a worker at 5.5GB mid-job during a redeploy, and it could as
          # easily have been Coolify. Capping below that keeps the blast radius
          # inside the container, where the restart policy and
          # reconcile_orphaned_jobs settle the job cleanly.
          memory: 6G
          cpus: "6.5"
    # One worker. Two would halve each other's cores and double peak RAM on a
    # box that has neither to spare. Scale by adding hosts, not replicas.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  # Expires artifacts past their TTL, and settles jobs whose worker died and
  # that nobody is polling. Reads the retention window from the same Settings
  # the API does.
  reaper:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "bandit_api.reaper"]
    environment:
      BANDIT_REDIS_URL: redis://redis:6379/0
      BANDIT_DATA_DIR: /data
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - bandit-data:/data
    healthcheck:
      # The loop touches this file every pass; if the sweep stopped running the
      # timestamp goes stale and the container is restarted.
      test: ["CMD-SHELL", "find /tmp/reaper-alive -mmin -70 | grep -q ."]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  bandit-data:
  redis-data:
